[tool.poetry]
name = "takedown-atlas-backend"
version = "0.1.0"
description = "FastAPI backend for the Takedown Atlas MVP"
authors = ["Takedown Atlas Contributors <oss@takedownatlas.org>"]
license = "Apache-2.0"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = { extras = ["standard"], version = "^0.30.1" }
sqlmodel = "^0.0.19"
sqlalchemy = "^2.0.30"
psycopg = { extras = ["binary"], version = "^3.1.19" }
pydantic-settings = "^2.2.1"
python-multipart = "^0.0.9"
email-validator = "^2.1.1"
passlib = { extras = ["bcrypt"], version = "^1.7.4" }
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
redis = "^5.0.4"
celery = "^5.3.6"
boto3 = "^1.34.127"
slack-sdk = "^3.27.1"
python-slugify = "^8.0.4"
httpx = "^0.27.0"
structlog = "^24.1.0"
geojson = "^3.0.1"
shapely = "^2.0.4"
openpyxl = "^3.1.3"
polars = "^0.20.30"
pendulum = "^3.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.1"
pytest-asyncio = "^0.23.6"
pytest-cov = "^5.0.0"
httpx = "^0.27.0"
ruff = "^0.5.0"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
