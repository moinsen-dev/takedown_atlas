# GitHub Pages - Static HTML Configuration
# This configuration is minimal since we're using pure HTML/CSS/JS

# Site metadata (used by GitHub for repository info)
title: "Takedown Atlas"
description: "Turn your frustration into change. Report review removals anonymously and help create transparency."
url: "https://moinsen-dev.github.io"
baseurl: "/takedown_atlas"

# Disable Jekyll processing - we use pure HTML
plugins: []
markdown: kramdown
highlighter: none

# Exclude development files
exclude:
  - SITE_README.md
  - architecture.md
